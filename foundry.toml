[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "out"
libs = ["lib", "node_modules"]
# Production sources pin 0.8.37; unchanged legacy protocol test sources pin 0.8.34.
auto_detect_solc = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_remappings = false
remappings = [
 "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
 "forge-std/=lib/forge-std/src/",
 "aqua0/=vendor/aqua0/src/",
 "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
 "@openzeppelin/uniswap-hooks/=node_modules/@openzeppelin/uniswap-hooks/src/",
 "@uniswap/v4-core/src/=node_modules/@uniswap/v4-core/src/",
 "@uniswap/v4-core/types/=node_modules/@uniswap/v4-core/src/types/",
 "@uniswap/v4-core/libraries/=node_modules/@uniswap/v4-core/src/libraries/",
 "@uniswap/v4-core/interfaces/=node_modules/@uniswap/v4-core/src/interfaces/"
]
fs_permissions = [{ access = "read", path = "./config" }]
fuzz = { runs = 256 }
[fmt]
line_length = 120
